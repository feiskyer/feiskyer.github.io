{{ if site.Params.postNavigation | default true }}
{{ if or .PrevInSection .NextInSection }}
<nav class="pager" aria-label="上一篇和下一篇">
  {{ with .PrevInSection }}
  <a class="pager__prev" href="{{ .RelPermalink }}" rel="prev"><span>上一篇</span><strong>{{ .Title }}</strong></a>
  {{ end }}
  {{ with .NextInSection }}
  <a class="pager__next" href="{{ .RelPermalink }}" rel="next"><span>下一篇</span><strong>{{ .Title }}</strong></a>
  {{ end }}
</nav>
{{ end }}
{{ end }}
