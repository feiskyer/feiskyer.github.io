{{ $section := .Section }}
{{ $isTags := or (eq .Kind "taxonomy") (eq .Kind "term") }}
<header class="site-header">
  <div class="shell site-header__bar">
    <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} 首页">
      <img src="{{ site.Params.authorimage | default "/images/avatar.jpg" | relURL }}" alt="" width="40" height="40" decoding="async">
      <span>{{ site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ "/posts/" | relURL }}"{{ if and (eq $section "posts") (not $isTags) }} aria-current="true"{{ end }}>文章</a>
      <a href="{{ "/tags/" | relURL }}"{{ if $isTags }} aria-current="true"{{ end }}>主题</a>
      <a href="{{ "/about/" | relURL }}"{{ if eq .Type "about" }} aria-current="true"{{ end }}>关于</a>
      <a href="{{ "/index.xml" | relURL }}">RSS</a>
    </nav>
  </div>
</header>
