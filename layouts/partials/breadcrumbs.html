<nav class="breadcrumbs" aria-label="面包屑导航">
  <ol itemscope itemtype="https://schema.org/BreadcrumbList">
    <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"><a href="{{ site.Home.RelPermalink }}" itemprop="item"><span itemprop="name">首页</span></a><meta itemprop="position" content="1"></li>
    {{ if .IsPage }}
      {{ with .Section }}<li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"><a href="{{ printf "/%s/" . | relURL }}" itemprop="item"><span itemprop="name">文章</span></a><meta itemprop="position" content="2"></li>{{ end }}
      <li aria-current="page"><span>{{ .Title }}</span></li>
    {{ else }}
      <li aria-current="page"><span>{{ .Title }}</span></li>
    {{ end }}
  </ol>
</nav>
