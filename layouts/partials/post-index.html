{{/* A complete, year-grouped index of the given pages: one line per post. */}}
{{ range .GroupByDate "2006" }}
<section class="group" data-group>
  <h2 class="group__label">{{ .Key }}<small>{{ len .Pages }} 篇</small></h2>
  <ul class="entries">
    {{ range .Pages }}
    <li class="entry" data-entry data-tags="{{ delimit (.Params.tags | default slice) " " }}">
      <time class="entry__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01.02" }}</time>
      <a class="entry__title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
